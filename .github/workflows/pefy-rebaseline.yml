name: PEFY Rebaseline Evidence (NON-QUALIFYING)
run-name: PEFY evidence only — never a production qualification

on:
  pull_request:
    paths:
      - "scripts/pefy-runtime-rebaseline.sh"
      - "docs/PEFY_RUNTIME_QUALIFICATION.md"
      - ".github/workflows/pefy-rebaseline.yml"
  push:
    branches: [main]
    paths:
      - "scripts/pefy-runtime-rebaseline.sh"
      - "docs/PEFY_RUNTIME_QUALIFICATION.md"
      - ".github/workflows/pefy-rebaseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-only-non-qualifying:
    name: Evidence only (NON-QUALIFYING)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PEFY candidate with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate rebaseline script syntax
        run: bash -n scripts/pefy-runtime-rebaseline.sh

      - name: Measure canonical upstream/downstream drift without syncing
        env:
          PEFY_REBASELINE_REPORT_ONLY: "1"
        run: bash scripts/pefy-runtime-rebaseline.sh

      - name: Assert evidence is explicitly non-qualifying and immutable
        run: |
          test -f artifacts/pefy-openclaw-rebaseline/rebaseline.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/pefy-openclaw-rebaseline/rebaseline.json").read_text())
          if data.get("automatic_sync_performed") is not False:
              raise SystemExit("Automatic upstream mutation must remain false")
          if data.get("canonical_source_verified") is not True:
              raise SystemExit("Canonical upstream source was not verified")
          if data.get("canonical_upstream_url") != "https://github.com/openclaw/openclaw.git":
              raise SystemExit("Unexpected upstream source identity")

          license_data = data.get("license", {})
          if license_data.get("spdx") != "MIT":
              raise SystemExit("Expected repository-level SPDX MIT evidence")
          if license_data.get("pefy_text_verified") is not True:
              raise SystemExit("PEFY MIT body was not verified")
          if license_data.get("upstream_text_verified") is not True:
              raise SystemExit("Canonical upstream MIT body was not verified")
          if license_data.get("pefy_third_party_notices_declared") and not license_data.get("pefy_third_party_notices_sha256"):
              raise SystemExit("PEFY declares third-party notices without notice-file hash evidence")
          if license_data.get("upstream_third_party_notices_declared") and not license_data.get("upstream_third_party_notices_sha256"):
              raise SystemExit("Upstream declares third-party notices without notice-file hash evidence")

          if data.get("report_only") is not True:
              raise SystemExit("This workflow must remain report-only")
          if data.get("evidence_mode") != "NON_QUALIFYING_EVIDENCE_ONLY":
              raise SystemExit("Evidence-only workflow was mislabeled as qualifying")
          print(
              "PEFY non-qualifying governance evidence:",
              data["upstream_drift_class"],
              data["downstream_divergence_class"],
              data["review_class"],
              "upstream_notices=", license_data.get("upstream_third_party_notices_declared"),
          )
          PY

      - name: Upload non-qualifying rebaseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: pefy-openclaw-rebaseline-NON-QUALIFYING
          if-no-files-found: error
          path: artifacts/pefy-openclaw-rebaseline/**
